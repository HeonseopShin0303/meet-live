<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meet Live</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<!-- iOS ignores the manifest for home-screen installs and reads these instead. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meet Live">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #ffffff; --panel: #fafaf9; --line: #e7e5e4;
    --ink: #1c1917; --muted: #78716c; --faint: #a8a29e;
    --accent: #0f766e; --live: #16a34a; --warn: #b45309; --err: #b91c1c;
    --sp-a: #1d4ed8; --sp-b: #b45309; --sp-c: #7e22ce;
    --sp-d: #0f766e; --sp-e: #be123c; --sp-f: #4d7c0f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --panel: #292524; --line: #44403c;
      --ink: #f5f5f4; --muted: #a8a29e; --faint: #78716c;
      --accent: #5eead4; --live: #4ade80; --warn: #fbbf24; --err: #fca5a5;
      --sp-a: #93c5fd; --sp-b: #fcd34d; --sp-c: #d8b4fe;
      --sp-d: #5eead4; --sp-e: #fda4af; --sp-f: #bef264;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* An author `display` beats the browser's own [hidden] rule, so hiding an
     element by attribute silently does nothing. Settle it once, here. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .bar, .setup { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .setup { padding-top: 8px; border-top: 1px solid var(--line); }
  .fold { color: var(--muted); padding: 5px 9px; }
  .brand { font-weight: 650; margin-right: 2px; }
  select, button, input {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  select { max-width: 46vw; }
  button { cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  button.toggle { font-weight: 600; }
  button.toggle.on { color: var(--accent); border-color: var(--accent); }
  button.toggle.off { color: var(--faint); }
  .spacer { flex: 1; }
  .clock { font-variant-numeric: tabular-nums; color: var(--muted); }
  .state { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.live { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
  .dot.error { background: var(--err); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  .meter { width: 92px; height: 9px; border-radius: 999px; overflow: hidden;
           background: var(--line); flex-shrink: 0; }
  .fill { display: block; height: 100%; width: 0; background: var(--live); border-radius: 999px; }
  .fill.hot { background: var(--warn); }

  .stage { flex: 1; min-height: 0; display: flex; }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 0 10px;
         -webkit-overflow-scrolling: touch; }
  #view { max-width: 900px; margin: 0 auto; padding: 0 16px; }

  #speakers { width: 210px; flex-shrink: 0; overflow-y: auto; padding: 16px 12px;
              border-left: 1px solid var(--line); background: var(--panel); }
  .sp-head { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .sp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sp-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .sp-row input { flex: 1; min-width: 0; font-size: 13px; padding: 6px 8px; }
  .sp-note { font-size: 12px; color: var(--faint); margin-top: 12px; line-height: 1.45; }

  /* On a phone the rail would eat the transcript, so it moves under it. */
  @media (max-width: 720px) {
    .stage { flex-direction: column; }
    #speakers { width: auto; border-left: none; border-top: 1px solid var(--line);
                max-height: 34dvh; }
    select { max-width: 100%; }
    header { padding: 8px 10px; }
    .bar { gap: 7px; }
    .brand { display: none; }       /* the tab title already says it */
    .meter { width: 48px; }
    .fold-text { display: none; }   /* the caret alone keeps the bar one row */
    .fold { padding: 7px 10px; }
  }

  .sx-speaker { margin: 16px 0 8px; }
  .sx-speaker:first-child { margin-top: 0; }
  .chip { font-size: 12px; font-weight: 650; padding: 2px 9px; border-radius: 999px;
          border: 1px solid currentColor; background: none; font-family: inherit;
          cursor: pointer; line-height: 1.5; }
  .chip::after { content: "▾"; margin-left: 5px; opacity: .65; font-size: 10px; }
  .chip:hover { background: var(--panel); }

  /* Correcting a speaker from the transcript. */
  .picker { position: fixed; z-index: 20; background: var(--bg);
            border: 1px solid var(--line); border-radius: 12px; padding: 6px;
            min-width: 210px; max-width: 300px;
            box-shadow: 0 12px 34px rgba(0, 0, 0, .18); }
  .picker-title { font-size: 12px; color: var(--muted); padding: 6px 10px 8px; }
  .picker-row { display: flex; align-items: center; gap: 9px; width: 100%;
                border: none; background: none; border-radius: 8px;
                padding: 11px 10px; font-size: 14px; text-align: left; }
  .picker-row:hover { background: var(--panel); }
  .picker-row.on { font-weight: 650; }
  .picker-row.add { color: var(--accent); font-weight: 600; }
  .picker-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
  .picker-scope { display: flex; gap: 4px; padding: 0 6px 8px; }
  .scope-btn { flex: 1; font-size: 12px; padding: 7px 6px; border-radius: 7px;
               border: 1px solid var(--line); background: none; color: var(--muted); }
  .scope-btn.on { border-color: var(--accent); color: var(--accent); font-weight: 650; }
  .picker .tick { color: var(--accent); }
  .sx-pair + .sx-pair { margin-top: 12px; }
  .sx-src { color: var(--ink); line-height: 1.5; }
  .sx-dst { color: var(--accent); font-size: 17px; line-height: 1.5; margin-top: 3px; }
  .sx-src + .sx-src, .sx-dst + .sx-dst { margin-top: 3px; }
  /* Height is reserved even when empty: collapsing it when the speaker pauses
     moved every line below and the reader lost their place. */
  .partial { color: var(--faint); font-style: italic; min-height: 1.6em; }

  .empty { padding: 44px 16px; color: var(--faint); text-align: center; line-height: 1.7; }
  .empty b { color: var(--ink); }
  .title { border: none; border-bottom: 1px solid var(--line); border-radius: 0;
           background: var(--bg); width: 100%; padding: 10px 16px;
           font-size: 16px; font-weight: 650; color: var(--ink); }
  .title::placeholder { font-weight: 400; color: var(--faint); }
  .title:focus { outline: none; border-bottom-color: var(--accent); }

  .banner { padding: 9px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
            color: var(--warn); font-size: 13px; }

  /* First run: no key, nothing else matters until one is entered. */
  #gate { position: fixed; inset: 0; background: var(--bg); z-index: 10;
          display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate-card { max-width: 460px; width: 100%; }
  .gate-card h1 { font-size: 20px; margin: 0 0 8px; }
  .gate-card p { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .gate-card input { width: 100%; margin: 14px 0 10px; font-family: ui-monospace, monospace; }
  .gate-card button { width: 100%; padding: 11px; }
  .gate-card .note { font-size: 12px; color: var(--faint); margin-top: 14px; }

  /* After the base rules above, so these win. A sheet at the bottom: reachable
     by thumb, and it never covers the line being corrected the way a popover
     next to the chip would. */
  @media (max-width: 720px) {
    .picker { left: 8px; right: 8px; bottom: 8px; top: auto;
              max-width: none; padding: 8px; border-radius: 14px; }
    .picker-row { padding: 14px 12px; font-size: 15px; }
    .chip { padding: 4px 11px; font-size: 13px; }
  }
</style>
</head>
<body>

<div id="gate" hidden>
  <div class="gate-card">
    <h1>Meet Live</h1>
    <p>Soniox API 키를 입력하세요. 키는 이 기기의 브라우저에만 저장되며
       서버로 전송되지 않습니다.</p>
    <input id="keyInput" type="password" placeholder="snx_..." autocomplete="off"
           autocapitalize="off" spellcheck="false">
    <button class="primary" id="keySave">시작하기</button>
    <div class="note">
      키 발급: console.soniox.com → My First Project → API Keys<br>
      나중에 헤더의 <b>키</b> 버튼에서 바꿀 수 있습니다.
    </div>
  </div>
</div>

<header>
  <!-- Two rows. The top one is what a meeting in progress needs — start, stop,
       level, clock — and never goes away. Everything that is set once before
       recording lives below it and folds, because on a phone the full bar ate
       most of the transcript. -->
  <div class="bar">
    <span class="brand">Meet Live</span>
    <button id="start" class="primary">시작</button>
    <button id="stop" disabled>정지</button>
    <span class="meter"><span class="fill" id="meterFill"></span></span>
    <span class="spacer"></span>
    <span class="clock" id="clock">00:00:00</span>
    <span class="state"><span class="dot" id="dot"></span><span id="stateText">대기</span></span>
    <button id="fold" class="fold" aria-expanded="true" title="설정 접기/펼치기"><span
      class="fold-text">설정 </span><span id="foldCaret">▴</span></button>
  </div>
  <div class="setup" id="setup">
    <select id="source" title="오디오 소스">
      <option value="mic">🎤 마이크</option>
      <option value="display">🔊 탭·시스템 소리</option>
      <option value="both">🎤+🔊 마이크 + 탭 소리</option>
    </select>
    <select id="device" title="마이크 장치"></select>
    <select id="spoken" title="화자가 쓰는 언어">
      <option value="">자동 감지</option>
      <option value="Korean,English" selected>한국어 + English</option>
      <option value="Korean">한국어</option>
      <option value="English">English</option>
      <option value="Japanese">日本語</option>
      <option value="Mandarin Chinese">中文</option>
    </select>
    <button id="xlate" class="toggle on">번역 ON</button>
    <select id="target" title="번역 언어">
      <option value="Korean">→ 한국어</option>
      <option value="English">→ English</option>
      <option value="Japanese">→ 日本語</option>
    </select>
    <input id="terms" placeholder="용어: 협동로봇, 뉴턴" title="인식 정확도를 높일 전문용어">
    <button id="test">마이크 테스트</button>
    <span class="spacer"></span>
    <button id="clear">기록 지우기</button>
    <select id="exportMode" title="저장할 내용">
      <option value="both">원문 + 번역</option>
      <option value="src">원문만</option>
      <option value="dst">번역만</option>
    </select>
    <button id="export" disabled>기록 저장</button>
    <button id="redo" disabled title="녹음된 소리를 다시 올려 화자를 더 정확히 나눕니다">화자 재분리</button>
    <button id="keyEdit" title="API 키 변경">키</button>
  </div>
</header>

<input id="title" class="title" placeholder="회의 제목 — 저장 파일 이름이 됩니다"
       autocomplete="off" spellcheck="false" maxlength="80">

<div class="banner" id="banner" hidden></div>

<div class="stage">
  <main id="main"><div id="view"></div></main>
  <aside id="speakers">
    <div class="sp-head">화자</div>
    <div id="speakerList"></div>
    <div class="sp-note" id="speakerNote">아직 인식된 화자가 없습니다.</div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);

// --- Soniox, spoken to directly from the browser -----------------------------
// There is no server in this build. The page opens the WebSocket itself, which is
// why it must be served over HTTPS: getUserMedia is refused on plain http outside
// localhost, and without a microphone none of the rest matters.
const ENDPOINT = "wss://stt-rt.soniox.com/transcribe-websocket";
const MODEL = "stt-rt-v5";
// 16 kHz is the standard rate for speech recognition and a quarter of the bytes
// of 48 kHz, which matters on a phone's data connection.
const RATE = 16000;

const LANGS = { "Korean": "ko", "English": "en", "Japanese": "ja", "Mandarin Chinese": "zh" };
const code = (name) => LANGS[name] || String(name).slice(0, 2).toLowerCase();

// Endpoint detection emits these as ordinary tokens; they are control marks, not
// speech, and rendering them puts a literal "<end>" mid-sentence.
const MARKERS = new Set(["<end>", "<fin>"]);

const STORE = "meetLive.v1";
const KEY_STORE = "meetLive.key";

let apiKey = "";
let segments = [];          // [{speaker, src, dst}] — grows across runs
let runBase = 0;            // where the run in progress begins
let partial = { src: "", dst: "" };
let names = {};             // speaker id -> name typed by the user
let translateOn = true, exported = true;

let ws = null, stream = null, audioCtx = null, node = null, wakeLock = null;
let testing = false, streaming = false;
let ticker = null, startedAt = 0, elapsedBase = 0, saveTimer = null;
let captureRate = RATE, laggy = false;
let micStream = null, sysStream = null, mixDest = null;

// --- persistence -------------------------------------------------------------

function save() {
  try {
    // Refuse to blank out a stored meeting. Whatever leaves this page holding
    // nothing — a failed restore, a half-loaded tab — must not be able to take
    // the record with it. Clearing goes through removeItem, not through here.
    if (!segments.length) {
      const prior = JSON.parse(localStorage.getItem(STORE) || "{}");
      if (Array.isArray(prior.segments) && prior.segments.length) return;
    }
    localStorage.setItem(STORE, JSON.stringify({
      segments, names, elapsed: elapsedSoFar(), title: $("title").value,
    }));
  } catch (err) { /* private window or full quota; the live transcript still stands */ }
}

function scheduleSave() {
  if (saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = null; save(); }, 1500);
}

function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
    if (Array.isArray(saved.segments)) {
      segments = saved.segments;
      // Meetings stored before speakers were normalised may hold numbers.
      for (const seg of segments) if (seg.speaker != null) seg.speaker = String(seg.speaker);
    }
    if (saved.names && typeof saved.names === "object") names = saved.names;
    // Carry the clock over too: a meeting that resumes at 00:00:00 reads as a
    // fresh one even when the transcript above it is intact.
    if (typeof saved.elapsed === "number") elapsedBase = saved.elapsed;
    if (typeof saved.title === "string") $("title").value = saved.title;
    apiKey = localStorage.getItem(KEY_STORE) || "";
  } catch (err) { /* corrupt or unavailable: start clean */ }
  runBase = segments.length;
}

// --- token assembly ----------------------------------------------------------
// Tokens arrive as subwords tagged `translation_status` and flagged `is_final`.
// The docs warn transcription and translation tokens are "not 1-to-1 mapped" —
// true of tokens, but the STREAM alternates in chunks: spoken tokens, then the
// translation of that chunk. Switching back to original marks the end of a pair,
// which is what lets each source line sit directly above its own translation.

function openBlock(speaker) {
  const last = segments[segments.length - 1];
  if (last && !last.dst && last.speaker === speaker && segments.length > runBase) return last;
  const block = { speaker, src: "", dst: "" };
  segments.push(block);
  return block;
}

let lastSpeaker = "1";

function absorb(response) {
  const pendingSrc = [], pendingDst = [];
  for (const token of response.tokens || []) {
    const text = token.text || "";
    if (!text || MARKERS.has(text.trim())) continue;
    const isTranslation = token.translation_status === "translation";

    if (!token.is_final) {
      (isTranslation ? pendingDst : pendingSrc).push(text);
      continue;
    }
    if (isTranslation) {
      if (!segments.length) segments.push({ speaker: lastSpeaker, src: "", dst: "" });
      segments[segments.length - 1].dst += text;
    } else {
      // Speaker only rides on spoken tokens, and only while diarization is on;
      // carry the last one forward across the gaps. Normalised to a string: the
      // field arrives as a number, while ids minted here and used as keys into
      // `names` are strings, and 2 never matches "2". A falsy check would also
      // throw away a speaker 0.
      const sp = token.speaker;
      if (sp !== undefined && sp !== null && sp !== "") lastSpeaker = String(sp);
      openBlock(lastSpeaker).src += text;
    }
  }
  partial = { src: pendingSrc.join("").trim(), dst: pendingDst.join("").trim() };
  if (segments.length) exported = false;
}

// --- rendering ---------------------------------------------------------------

const SPEAKER_VARS = ["--sp-a", "--sp-b", "--sp-c", "--sp-d", "--sp-e", "--sp-f"];
const speakerColor = (id) =>
  "var(" + SPEAKER_VARS[Math.abs((parseInt(id, 10) || 1) - 1) % SPEAKER_VARS.length] + ")";
const speakerLabel = (id) => (names[id] || "").trim() || "화자 " + id;

// --- speaker correction ------------------------------------------------------
// Diarization mislabels a turn now and then, and a wrong name on a line is worse
// than no name at all. The chip that heads a run is the handle: tapping it moves
// that whole run elsewhere, because the run is what the chip stands for on
// screen. Rows are finger-sized and the sheet sits under the thumb on a phone.

let picker = null;

function nextSpeakerId() {
  let max = 0;
  for (const seg of segments) {
    const n = parseInt(seg.speaker, 10);
    if (n > max) max = n;
  }
  return String(max + 1);
}

function speakerIds() {
  const ids = [];
  for (const seg of segments) if (seg.speaker && !ids.includes(seg.speaker)) ids.push(seg.speaker);
  return ids;
}

function runLength(at) {
  const from = segments[at].speaker;
  let n = 0;
  while (at + n < segments.length && segments[at + n].speaker === from) n++;
  return n;
}

function reassign(at, to, scope) {
  const from = segments[at].speaker;
  closePicker();
  if (from === to) return;
  if (scope === "line") {
    // Peel off the first line and leave the rest. The remainder keeps the old
    // speaker and grows its own chip, so repeating this splits a run anywhere —
    // which is what a turn with two people merged into it needs.
    segments[at].speaker = to;
  } else {
    for (let i = at; i < segments.length && segments[i].speaker === from; i++) {
      segments[i].speaker = to;
    }
  }
  render();
  save();
}

function onPickerOutside(e) { if (picker && !picker.contains(e.target)) closePicker(); }
function onPickerKey(e) { if (e.key === "Escape") closePicker(); }

function closePicker() {
  if (!picker) return;
  picker.remove();
  picker = null;
  document.removeEventListener("pointerdown", onPickerOutside, true);
  document.removeEventListener("keydown", onPickerKey, true);
  window.removeEventListener("resize", closePicker);
}

function openPicker(chip, at) {
  closePicker();
  const current = segments[at].speaker;

  picker = document.createElement("div");
  picker.className = "picker";
  picker.setAttribute("role", "dialog");
  picker.setAttribute("aria-label", "화자 변경");

  const title = document.createElement("div");
  title.className = "picker-title";
  title.textContent = "이 발언의 화자";
  picker.appendChild(title);

  // Only worth asking when the chip covers more than one line.
  const lines = runLength(at);
  let scope = "run";
  if (lines > 1) {
    const choice = document.createElement("div");
    choice.className = "picker-scope";
    for (const [value, text] of [["run", "묶음 전체 " + lines + "줄"], ["line", "첫 줄만"]]) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "scope-btn" + (value === scope ? " on" : "");
      b.textContent = text;
      b.onclick = () => {
        scope = value;
        for (const other of choice.children) other.classList.toggle("on", other === b);
      };
      choice.appendChild(b);
    }
    picker.appendChild(choice);
  }

  for (const id of speakerIds()) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "picker-row" + (id === current ? " on" : "");
    const dot = document.createElement("span");
    dot.className = "sp-dot";
    dot.style.background = speakerColor(id);
    const name = document.createElement("span");
    name.className = "picker-name";
    name.textContent = speakerLabel(id);
    row.append(dot, name);
    if (id === current) {
      const tick = document.createElement("span");
      tick.className = "tick";
      tick.textContent = "✓";
      row.appendChild(tick);
    }
    row.onclick = () => reassign(at, id, scope);
    picker.appendChild(row);
  }

  const add = document.createElement("button");
  add.type = "button";
  add.className = "picker-row add";
  add.textContent = "+ 새 화자";
  add.onclick = () => reassign(at, nextSpeakerId(), scope);
  picker.appendChild(add);

  document.body.appendChild(picker);

  // A phone gets a sheet at the bottom (CSS places it); a pointer gets the list
  // under the chip it came from, kept inside the window.
  if (!window.matchMedia("(max-width: 720px)").matches) {
    const r = chip.getBoundingClientRect();
    picker.style.left =
      Math.max(8, Math.min(r.left, innerWidth - picker.offsetWidth - 8)) + "px";
    picker.style.top =
      Math.max(8, Math.min(r.bottom + 6, innerHeight - picker.offsetHeight - 8)) + "px";
  }

  // Deferred: the click that opened this would otherwise close it immediately.
  setTimeout(() => {
    document.addEventListener("pointerdown", onPickerOutside, true);
    document.addEventListener("keydown", onPickerKey, true);
    // Rotating the phone moves the chip out from under coordinates already
    // written, and crosses the breakpoint the layout was chosen at. Close it
    // and let the next tap place a fresh one.
    window.addEventListener("resize", closePicker, { once: true });
  }, 0);
}

// Soniox punctuates its output, so a plain sentence split is enough here.
const sentences = (text) =>
  !text ? [] : text.split(/(?<=[.!?…])\s+/).map((t) => t.trim()).filter(Boolean);

function render() {
  const view = $("view");
  view.innerHTML = "";

  if (!segments.length && !partial.src && !partial.dst) {
    const hint = document.createElement("div");
    hint.className = "empty";
    hint.innerHTML = "<b>마이크 테스트</b>로 레벨 바가 움직이는지 확인한 뒤<br><b>시작</b>을 누르세요.";
    view.appendChild(hint);
    renderSpeakers();
    return;
  }

  let shown = null;
  for (let at = 0; at < segments.length; at++) {
    const block = segments[at];
    // One chip per speaker run: a speaker talking for a minute produces many
    // blocks and a chip on each would be noise. The chip carries the index it
    // heads, which is what a correction acts on.
    if (block.speaker !== shown) {
      shown = block.speaker;
      const head = document.createElement("div");
      head.className = "sx-speaker";
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.type = "button";
      chip.style.color = speakerColor(shown);
      chip.textContent = speakerLabel(shown);
      chip.title = "눌러서 화자 변경";
      const runAt = at;
      chip.onclick = () => openPicker(chip, runAt);
      head.appendChild(chip);
      view.appendChild(head);
    }
    const pair = document.createElement("div");
    pair.className = "sx-pair";
    for (const line of sentences(block.src)) {
      const row = document.createElement("div");
      row.className = "sx-src";
      row.textContent = line;
      pair.appendChild(row);
    }
    for (const line of sentences(block.dst)) {
      const row = document.createElement("div");
      row.className = "sx-dst";
      row.textContent = line;
      pair.appendChild(row);
    }
    view.appendChild(pair);
  }

  const pending = document.createElement("div");
  pending.className = "sx-pair";
  const ps = document.createElement("div");
  ps.className = "partial";
  ps.textContent = partial.src;
  pending.appendChild(ps);
  if (partial.dst) {
    const pd = document.createElement("div");
    pd.className = "partial";
    pd.style.color = "var(--accent)";
    pd.style.opacity = ".55";
    pd.textContent = partial.dst;
    pending.appendChild(pd);
  }
  view.appendChild(pending);
  renderSpeakers();
}

function renderSpeakers() {
  const list = $("speakerList");
  const ids = [];
  for (const seg of segments) if (seg.speaker && !ids.includes(seg.speaker)) ids.push(seg.speaker);
  // Rebuild only when the roster changes, so typing a name is never interrupted
  // by a re-render mid-keystroke.
  if (list.dataset.ids === ids.join(",")) return;
  list.dataset.ids = ids.join(",");
  list.innerHTML = "";
  for (const id of ids) {
    const row = document.createElement("div");
    row.className = "sp-row";
    const dot = document.createElement("span");
    dot.className = "sp-dot";
    dot.style.background = speakerColor(id);
    const input = document.createElement("input");
    input.value = names[id] || "";
    input.placeholder = "화자 " + id;
    input.oninput = () => { names[id] = input.value; render(); save(); };
    row.append(dot, input);
    list.appendChild(row);
  }
  $("speakerNote").textContent = ids.length
    ? ids.length + "명 인식됨. 이름을 넣으면 과거 기록까지 바뀝니다."
    : "아직 인식된 화자가 없습니다.";
}

let following = true;
$("main").addEventListener("scroll", () => {
  const m = $("main");
  following = m.scrollHeight - m.scrollTop - m.clientHeight < 60;
});
const autoscroll = () => { if (following) $("main").scrollTop = $("main").scrollHeight; };

// --- audio -------------------------------------------------------------------

const WORKLET = `
// Downsamples to 16 kHz here rather than shipping whatever the hardware runs at.
// A phone that refuses a 16 kHz context hands back 48 kHz, and sending that raw
// is three times the uplink for audio Soniox gains nothing from — 16 kHz already
// covers speech. On a phone that cannot sustain the larger stream the socket's
// send queue grows and never drains, which is heard as a delay that creeps up
// over a meeting rather than a constant lag.
//
// Each output sample is the mean of the input samples falling inside its window.
// At the usual 3:1 that doubles as the anti-alias filter that plain decimation
// would skip; at an awkward ratio the window simply straddles samples.
class Tap extends AudioWorkletProcessor {
  constructor(options) {
    super();
    this.rate = options.processorOptions.rate;
    this.step = sampleRate / this.rate;
    this.sum = 0; this.n = 0; this.due = this.step;
    this.buf = []; this.held = 0;
    this.target = Math.round(this.rate * 0.12);
    this.told = 0;
  }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    let peak = 0;
    const out = new Int16Array(Math.ceil(ch.length / this.step) + 1);
    let k = 0;
    for (let i = 0; i < ch.length; i++) {
      const v = ch[i];
      const a = v < 0 ? -v : v;
      if (a > peak) peak = a;
      this.sum += v; this.n++;
      if (--this.due <= 0) {
        const m = Math.max(-1, Math.min(1, this.sum / this.n));
        out[k++] = m < 0 ? m * 0x8000 : m * 0x7fff;
        this.sum = 0; this.n = 0; this.due += this.step;
      }
    }
    if (k) { this.buf.push(out.subarray(0, k)); this.held += k; }

    if (this.held >= this.target) {
      const chunk = new Int16Array(this.held);
      let at = 0;
      for (const part of this.buf) { chunk.set(part, at); at += part.length; }
      this.buf = []; this.held = 0;
      this.told = currentTime;
      this.port.postMessage({ pcm: chunk, peak }, [chunk.buffer]);
    } else if (currentTime - this.told > 0.05) {
      // The level bar only needs to look alive. One message per 128-sample
      // quantum is 375 a second at 48 kHz, each one writing to the DOM.
      this.told = currentTime;
      this.port.postMessage({ peak });
    }
    return true;
  }
}
registerProcessor("tap", Tap);
`;

// Some phones apply their own echo cancellation or noise suppression whatever we
// ask for, and some refuse 16 kHz. Both change how the room sounds, so the mic
// test says what the device actually settled on rather than what was requested.
function micSummary() {
  const track = stream && stream.getAudioTracks()[0];
  if (!track) return "";
  const got = track.getSettings ? track.getSettings() : {};
  const forced = [];
  if (got.echoCancellation) forced.push("에코 제거");
  if (got.noiseSuppression) forced.push("잡음 억제");
  const rate = audioCtx ? Math.round(audioCtx.sampleRate / 1000) + "kHz" : "";
  return forced.length
    ? "(" + rate + ", 기기가 " + forced.join("·") + "를 강제해 먼 목소리가 작아질 수 있습니다)"
    : "(" + rate + ", 원시 입력)";
}

async function listDevices() {
  const sel = $("device");
  const devs = (await navigator.mediaDevices.enumerateDevices())
    .filter((d) => d.kind === "audioinput");
  const chosen = sel.value;
  sel.innerHTML = "";
  for (const d of devs) {
    const o = document.createElement("option");
    o.value = d.deviceId;
    o.textContent = d.label || "(권한 허용 후 이름 표시)";
    sel.appendChild(o);
  }
  if (chosen) sel.value = chosen;
}

// Screen sharing hands back the shared tab's own audio and nothing else — the
// microphone is a separate device and never rides along. An online meeting needs
// both: the far end arrives through the tab, the person at the keyboard through
// the mic. So capture each and sum them into one bus.
async function grabSystem() {
  // Video is requested because a picker with no video track is refused by some
  // browsers; it is dropped the moment it arrives.
  const got = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  got.getVideoTracks().forEach((t) => t.stop());
  if (!got.getAudioTracks().length) {
    got.getTracks().forEach((t) => t.stop());
    throw new Error("공유 창에서 '시스템 오디오 공유'(탭 오디오 공유)를 켜야 합니다.");
  }
  return got;
}

async function grabMic() {
  const id = $("device").value;
  return navigator.mediaDevices.getUserMedia({
    audio: {
      deviceId: id ? { exact: id } : undefined,
        // Echo cancellation is the wrong tool here and costs more than it looks.
        // Asking for it puts a phone on its voice-call audio path, which is tuned
        // for a handset held to the face: it favours the near mic and gates away
        // anything further off, so the other people at the table go quiet. It also
        // subtracts whatever the device is playing, which is exactly the far end
        // of a call we would want recorded. Noise suppression is no better for
        // this: it reshapes voice timbre, and timbre is what the diarizer separates
        // speakers by. Gain control is the mild one — it lifts a distant talker
        // without touching those cues — so it stays.
      echoCancellation: false, noiseSuppression: false, autoGainControl: true,
      channelCount: 1,
    },
  });
}

async function openAudio() {
  if (audioCtx) return;
  const want = $("source").value;
  // System audio first: it opens a picker, and being sent to it after having
  // already granted the microphone is the less confusing order to cancel out of.
  if (want === "display" || want === "both") sysStream = await grabSystem();
  try {
    if (want === "mic" || want === "both") micStream = await grabMic();
  } catch (err) {
    if (sysStream) { sysStream.getTracks().forEach((t) => t.stop()); sysStream = null; }
    throw err;
  }
  stream = micStream || sysStream;

  audioCtx = new AudioContext({ sampleRate: RATE });
  const url = URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" }));
  await audioCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);

  // 16 kHz unless the hardware genuinely runs slower, which nothing does.
  captureRate = Math.min(RATE, audioCtx.sampleRate);
  node = new AudioWorkletNode(audioCtx, "tap", {
    processorOptions: { rate: captureRate },
    // Tab audio is usually stereo and the mic mono. Fold to one channel here, or
    // the worklet would read channel 0 and quietly drop half of a stereo source.
    channelCount: 1, channelCountMode: "explicit", channelInterpretation: "speakers",
  });
  node.port.onmessage = (e) => {
    const fill = $("meterFill");
    const peak = e.data.peak || 0;
    fill.style.width = Math.min(100, Math.pow(peak, 0.5) * 108) + "%";
    fill.className = "fill" + (peak > 0.9 ? " hot" : "");
    if (!(streaming && e.data.pcm && ws && ws.readyState === 1)) return;

    // What has been handed to the socket but not yet put on the wire. If this
    // keeps growing the uplink cannot carry the stream, and every word arrives
    // later than the one before it — a delay that builds instead of settling.
    // Say so, because from the transcript alone it reads as a slow server.
    const backlog = ws.bufferedAmount / (captureRate * 2);
    if (backlog > 2 && !laggy) {
      laggy = true;
      show("업로드가 음성 속도를 못 따라갑니다. 전사가 점점 늦어집니다 — 신호가 약하거나 회선이 느린 상태입니다.");
    } else if (backlog < 0.5 && laggy) {
      laggy = false;
      show(null);
    }
    ws.send(e.data.pcm.buffer);
  };
  const mix = audioCtx.createGain();
  mix.gain.value = 1;
  for (const src of [micStream, sysStream]) {
    if (!src) continue;
    const gain = audioCtx.createGain();
    // Headroom: two sources at full scale would sum past 1.0 and clip, and
    // clipping costs the timbre the speaker separation reads.
    gain.gain.value = micStream && sysStream ? 0.7 : 1;
    audioCtx.createMediaStreamSource(src).connect(gain).connect(mix);
  }
  mix.connect(node);

  // The recorder gets the same mix the transcriber hears, so re-splitting the
  // speakers later works on both sides of the meeting rather than just the mic.
  mixDest = audioCtx.createMediaStreamDestination();
  mix.connect(mixDest);

  // A worklet needs a downstream node to be pulled, but the audio must not be
  // played back — that would echo the room. Zero gain keeps it silent.
  const mute = audioCtx.createGain();
  mute.gain.value = 0;
  node.connect(mute).connect(audioCtx.destination);

  await listDevices();
}

function closeAudio() {
  streaming = false;
  if (node) { node.port.onmessage = null; node.disconnect(); node = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  for (const src of [micStream, sysStream]) if (src) src.getTracks().forEach((t) => t.stop());
  micStream = sysStream = stream = null;
  mixDest = null;
  $("meterFill").style.width = "0";
}

// --- wake lock ---------------------------------------------------------------
// A browser cannot record with the screen off: the page is suspended and capture
// stops. Holding the screen awake is the only way a web app can keep a long
// meeting running, so it is requested for the duration of a recording.

async function holdScreen() {
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    // A tab switch releases it; take it back when the page returns.
    document.addEventListener("visibilitychange", reacquire);
  } catch (err) {
    show("화면 꺼짐 방지를 사용할 수 없습니다. 화면이 꺼지면 녹음이 중단됩니다.");
  }
}

async function reacquire() {
  if (document.visibilityState === "visible" && streaming && !wakeLock) {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (err) {}
  }
}

function releaseScreen() {
  document.removeEventListener("visibilitychange", reacquire);
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

// --- re-transcription --------------------------------------------------------
// Live diarization has to name a speaker within a second of hearing them and can
// never revise; the async model sees the whole recording before it decides, which
// the docs call markedly more accurate. So keep the sound, and let the meeting be
// run through it again afterwards. It bills at about half the live rate, and it
// also recovers whatever was said while the socket was down — the microphone kept
// recording through the gap even though nothing reached Soniox.

const ASYNC_MODEL = "stt-async-v5";
const API = "https://api.soniox.com/v1";

let recorder = null;
let recordings = [];        // one blob per run: separate recordings cannot be joined
let recordedMs = 0, recStart = 0, redoing = false;

function pickMime() {
  if (!window.MediaRecorder) return null;
  // Soniox accepts webm, mp4 and m4a among others; Safari has no webm.
  for (const m of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/mpeg"]) {
    if (MediaRecorder.isTypeSupported(m)) return m;
  }
  return "";
}

function startRecording() {
  const mime = pickMime();
  const source = mixDest ? mixDest.stream : stream;
  if (!source || mime === null) return;
  try {
    recorder = new MediaRecorder(source,
      mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : undefined);
  } catch (err) { recorder = null; return; }
  const parts = [], type = recorder.mimeType || mime || "audio/webm";
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) parts.push(e.data); };
  recorder.onstop = () => {
    if (parts.length) recordings.push(new Blob(parts, { type }));
    showRedo();
  };
  recStart = Date.now();
  recorder.start(5000);     // flush every 5s so a crash costs seconds, not the meeting
}

function stopRecording() {
  if (!recorder) return;
  recordedMs += Date.now() - recStart;
  try { recorder.stop(); } catch (err) {}
  recorder = null;
}

function showRedo() {
  const held = recordings.length ? Math.max(1, Math.round(recordedMs / 60000)) : 0;
  $("redo").textContent = held ? "화자 재분리 (" + held + "분)" : "화자 재분리";
  $("redo").disabled = !recordings.length || streaming || redoing;
}

async function api(path, opts) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { Authorization: "Bearer " + apiKey, ...((opts || {}).headers) },
  });
  if (!res.ok) {
    const detail = await res.text().catch(() => "");
    const err = new Error("[" + res.status + "] " + detail.slice(0, 200));
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

function asyncBody(fileId, oneWayOnly) {
  const body = { model: ASYNC_MODEL, file_id: fileId, enable_speaker_diarization: true };
  const hints = ($("spoken").value || "").split(",").filter(Boolean).map(code);
  if (hints.length) body.language_hints = hints;
  if (translateOn) {
    const target = code($("target").value);
    const others = hints.filter((h) => h !== target);
    body.translation = (!oneWayOnly && hints.length >= 2 && others.length)
      ? { type: "two_way", language_a: others[0], language_b: target }
      : { type: "one_way", target_language: target };
  }
  return body;
}

async function transcribeBlob(blob, note) {
  note("업로드 중");
  const form = new FormData();
  form.append("file", blob, "meeting." + (blob.type.indexOf("mp4") >= 0 ? "mp4" : "webm"));
  const file = await api("/files", { method: "POST", body: form });

  try {
    const post = (oneWay) => api("/transcriptions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(asyncBody(file.id, oneWay)),
    });
    let job;
    try {
      job = await post(false);
    } catch (err) {
      // Two-way translation is documented for real-time; the async reference only
      // shows one-way. If it is refused, ask for the mode that is documented.
      if (err.status !== 400 || !translateOn) throw err;
      job = await post(true);
    }

    try {
      note("전사 중");
      let state = job;
      while (state.status !== "completed") {
        if (state.status === "error") throw new Error(state.error_message || "전사 실패");
        await new Promise((r) => setTimeout(r, 2000));
        state = await api("/transcriptions/" + job.id);
      }
      return (await api("/transcriptions/" + job.id + "/transcript")).tokens || [];
    } finally {
      api("/transcriptions/" + job.id, { method: "DELETE" }).catch(() => {});
    }
  } finally {
    // Do not leave the meeting sitting in the account afterwards.
    api("/files/" + file.id, { method: "DELETE" }).catch(() => {});
  }
}

// The whole token list at once, paired the way the live stream is.
function tokensToSegments(tokens, offset) {
  const out = [];
  let speaker = String(1 + offset);
  for (const token of tokens) {
    const text = token.text || "";
    if (!text || MARKERS.has(text.trim())) continue;
    if (token.translation_status === "translation") {
      if (!out.length) out.push({ speaker, src: "", dst: "" });
      out[out.length - 1].dst += text;
      continue;
    }
    const sp = token.speaker;
    // Each recording numbers its speakers from scratch, so run 2's "1" is not
    // run 1's "1". Shifting keeps them apart: one person split across two runs is
    // a correction the chips can make, whereas two people merged is invisible.
    if (sp !== undefined && sp !== null && sp !== "") speaker = String(Number(sp) + offset);
    const last = out[out.length - 1];
    if (last && !last.dst && last.speaker === speaker) last.src += text;
    else out.push({ speaker, src: text, dst: "" });
  }
  return out;
}

async function redo() {
  if (!recordings.length || streaming || redoing) return;
  const minutes = Math.max(1, Math.round(recordedMs / 60000));
  if (!confirm(
    "녹음된 소리 약 " + minutes + "분을 Soniox에 올려 처음부터 다시 전사합니다.\n\n" +
    "· 화자 분리가 더 정확해집니다\n" +
    "· 지금 화면의 기록과 지정한 화자 이름은 새 결과로 대체됩니다\n" +
    "· 음성 길이만큼 비용이 다시 청구됩니다\n\n계속할까요?")) return;

  redoing = true;
  showRedo();
  const built = [];
  let offset = 0;
  try {
    for (let i = 0; i < recordings.length; i++) {
      const label = recordings.length > 1 ? " (" + (i + 1) + "/" + recordings.length + ")" : "";
      const tokens = await transcribeBlob(recordings[i], (what) => {
        setState(what + label, "");
        show("화자 재분리 — " + what + label + ". 창을 닫지 마세요.");
      });
      const part = tokensToSegments(tokens, offset);
      for (const seg of part) offset = Math.max(offset, Number(seg.speaker));
      built.push.apply(built, part);
    }
  } catch (err) {
    setState("재분리 실패", "error");
    show("재분리에 실패했습니다: " + err.message + " (기존 기록은 그대로입니다)");
    redoing = false;
    showRedo();
    return;
  }

  segments = built;
  runBase = segments.length;
  names = {};      // async numbers speakers afresh; old names would land on the wrong people
  partial = { src: "", dst: "" };
  $("speakerList").dataset.ids = "\u0000";
  redoing = false;
  setState("정지됨", "");
  show("화자 재분리를 마쳤습니다. 이름을 다시 지정해 주세요.");
  render();
  save();
  $("export").disabled = !segments.length;
  showRedo();
  autoscroll();
}

$("redo").onclick = redo;
$("title").oninput = () => scheduleSave();

// --- session -----------------------------------------------------------------

function buildConfig() {
  const config = {
    api_key: apiKey,
    model: MODEL,
    audio_format: "pcm_s16le",
    // What the worklet actually emits. It resamples, so this is 16 kHz whatever
    // rate the phone's hardware decided to run at.
    sample_rate: captureRate,
    num_channels: 1,
    enable_speaker_diarization: true,
    // Deliberately off: the docs state endpoint detection "force[s] tokens to
    // finalize early, which reduces diarization accuracy". Speaker labels are the
    // point of this app, so the slightly later commit is the better trade.
    enable_endpoint_detection: false,
  };
  const hints = ($("spoken").value || "").split(",").filter(Boolean).map(code);
  if (hints.length) config.language_hints = hints;

  if (translateOn) {
    const target = code($("target").value);
    const others = hints.filter((h) => h !== target);
    config.translation = (hints.length >= 2 && others.length)
      ? { type: "two_way", language_a: others[0], language_b: target }
      : { type: "one_way", target_language: target };
  }
  const terms = $("terms").value.split(",").map((t) => t.trim()).filter(Boolean);
  if (terms.length) config.context = { terms };
  return config;
}

// A connection can die without the meeting being over. Losing one is a reason to
// open another, not to end the session: the transcript, the microphone and the
// clock all carry across, and the user never has to press 시작 again. Speech
// during the gap is genuinely gone — nothing reached Soniox — but everything
// before and after it stays in one record.

let retryTimer = null, retryWait = 0;
const RETRY_MAX = 15000;

function connect() {
  clearTimeout(retryTimer);
  retryTimer = null;
  setState(retryWait ? "재연결 중…" : "연결 중…", "");

  const sock = new WebSocket(ENDPOINT);
  ws = sock;
  sock.binaryType = "arraybuffer";

  sock.onopen = () => {
    sock.send(JSON.stringify(buildConfig()));
    // Everything recorded so far is history now; this connection writes after it.
    runBase = segments.length;
    retryWait = 0;
    setState("녹음 중", "live");
    show(null);
  };

  sock.onmessage = (ev) => {
    if (sock !== ws) return;
    const response = JSON.parse(ev.data);
    if (response.error_code) {
      // A rejected key or a bad config will be rejected again just as fast, so
      // this ends the session rather than joining the retry loop.
      setState("오류", "error");
      show("[" + response.error_code + "] " + (response.error_message || response.error_type));
      stop();
      return;
    }
    absorb(response);
    render();
    $("export").disabled = !segments.length;
    scheduleSave();
    autoscroll();
    if (response.finished) stop();
  };

  sock.onerror = () => { /* onclose follows and does the deciding */ };

  sock.onclose = () => {
    if (sock !== ws) return;          // a superseded socket closing is not news
    ws = null;
    if (!streaming) return;           // the user pressed 정지
    save();
    retryWait = Math.min(retryWait ? retryWait * 2 : 1000, RETRY_MAX);
    setState("연결 끊김 · 재연결 대기", "error");
    show("인터넷이 끊겼습니다. 연결되면 자동으로 이어서 기록합니다. 기록은 그대로 있습니다.");
    retryTimer = setTimeout(connect, retryWait);
  };
}

// The browser knows the network is back sooner than a backoff timer does.
window.addEventListener("online", () => {
  if (streaming && !ws) { retryWait = 0; connect(); }
});

async function start() {
  try { await openAudio(); }
  catch (err) { show("오디오를 열 수 없습니다: " + err.message); return; }

  testing = false;
  $("test").textContent = "마이크 테스트";
  streaming = true;
  laggy = false;
  // Keep the sound as well as the transcript. It runs off the same stream and
  // carries on through a reconnect, so the gap the live path loses is still here.
  startRecording();
  running(true);
  holdScreen();
  retryWait = 0;
  connect();
}

function stop() {
  // Before anything else: this ends the session, so a pending retry must not
  // quietly bring it back.
  streaming = false;
  clearTimeout(retryTimer);
  retryTimer = null;

  const sock = ws;
  if (sock && sock.readyState === 1) {
    // An empty frame ends the stream; the server flushes and closes.
    try { sock.send(new ArrayBuffer(0)); } catch (err) {}
  }
  releaseScreen();
  stopRecording();          // before closeAudio: it needs the stream still open
  closeAudio();
  running(false);
  setState("정지됨", "");
  save();
  // Hold the socket open briefly for the final tokens. Close the one that was
  // open when stop ran, not whatever `ws` points at by then — pressing 시작
  // again within this window used to hand the timer a freshly opened socket.
  setTimeout(() => {
    if (sock) sock.close();
    if (ws === sock) ws = null;
  }, 1500);
}

function elapsedSoFar() {
  return elapsedBase + (startedAt ? (Date.now() - startedAt) / 1000 : 0);
}

function running(on) {
  $("start").disabled = on;
  $("stop").disabled = !on;
  for (const id of ["source", "device", "spoken", "target", "terms", "test", "clear", "redo"]) {
    $(id).disabled = on;
  }
  if (on) {
    startedAt = Date.now();
    ticker = setInterval(
      () => ($("clock").textContent = hhmmss(elapsedBase + (Date.now() - startedAt) / 1000)), 250);
  } else {
    clearInterval(ticker);
    if (startedAt) elapsedBase += (Date.now() - startedAt) / 1000;
    startedAt = 0;
    $("clock").textContent = hhmmss(elapsedBase);
  }
}

// --- misc UI -----------------------------------------------------------------

function hhmmss(sec) {
  const s = Math.max(0, Math.floor(sec));
  return [s / 3600, (s % 3600) / 60, s % 60]
    .map((n) => String(Math.floor(n)).padStart(2, "0")).join(":");
}

function setState(text, cls) {
  $("stateText").textContent = text;
  $("dot").className = "dot" + (cls ? " " + cls : "");
}

function show(msg) {
  $("banner").hidden = !msg;
  if (msg) $("banner").textContent = msg;
}

$("test").onclick = async () => {
  if (testing) { testing = false; closeAudio(); $("test").textContent = "마이크 테스트"; show(null); return; }
  try {
    await openAudio();
    testing = true;
    $("test").textContent = "테스트 중지";
    show("말해보세요. 레벨 바가 움직이면 정상입니다. " + micSummary());
  } catch (err) { show("오디오를 열 수 없습니다: " + err.message); }
};

$("start").onclick = start;
$("stop").onclick = stop;

$("xlate").onclick = () => {
  translateOn = !translateOn;
  $("xlate").textContent = translateOn ? "번역 ON" : "번역 OFF";
  $("xlate").className = "toggle " + (translateOn ? "on" : "off");
  $("target").disabled = !translateOn;
  if (streaming) show("번역 설정은 다음 녹음부터 적용됩니다.");
};

$("source").onchange = () => {
  if (!streaming) { testing = false; closeAudio(); $("test").textContent = "마이크 테스트"; }
  $("device").disabled = $("source").value === "display";
};
$("device").onchange = () => { if (!streaming) { closeAudio(); if (testing) { testing = false; $("test").click(); } } };

$("clear").onclick = () => {
  if (segments.length) {
    const warning = exported
      ? "지금까지의 기록을 지우고 새 회의를 시작합니다. 계속할까요?"
      : "아직 저장하지 않은 기록이 있습니다. 지우면 되돌릴 수 없습니다. 계속할까요?";
    if (!confirm(warning)) return;
  }
  clearTimeout(saveTimer); saveTimer = null;
  segments = []; runBase = 0; partial = { src: "", dst: "" }; names = {};
  recordings = []; recordedMs = 0;
  $("title").value = "";
  lastSpeaker = "1"; elapsedBase = 0; exported = true;
  $("clock").textContent = "00:00:00";
  $("export").disabled = true;
  // A sentinel, not "": renderSpeakers skips the rebuild when the cached roster
  // matches, and an empty roster joins to "".
  $("speakerList").dataset.ids = "\u0000";
  render();
  showRedo();
  try { localStorage.removeItem(STORE); } catch (err) {}
  show("기록을 지웠습니다.");
};

// Windows rejects these outright and the rest travel badly between systems.
const BAD_IN_NAMES = /[\\/:*?"<>|\x00-\x1f]/g;

function meetingFileStem() {
  const now = new Date();
  const two = (n) => String(n).padStart(2, "0");
  // Local YYMMDD, not the ISO string: that is UTC, and an evening meeting would
  // be filed under the next day.
  const stamp = two(now.getFullYear() % 100) + two(now.getMonth() + 1) + two(now.getDate());
  const title = $("title").value.replace(BAD_IN_NAMES, "").trim().replace(/\s+/g, " ");
  return stamp + "_" + (title || "회의기록");
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob(["\ufeff" + text], { type }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  // Revoking immediately can cancel the download on some builds.
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

$("export").onclick = () => {
  const mode = $("exportMode").value;
  const label = { both: "원문 + 번역", src: "원문", dst: "번역" }[mode];
  const title = $("title").value.trim() || "회의 기록";

  const md = ["# " + title, "", "_" + label + "_", ""];
  const txt = [title, "(" + label + ")", ""];

  let shown = null;
  for (const block of segments) {
    if (block.speaker !== shown) {
      shown = block.speaker;
      md.push("### " + speakerLabel(shown), "");
      txt.push("[" + speakerLabel(shown) + "]");
    }
    if (mode !== "dst" && block.src) { md.push(block.src, ""); txt.push(block.src); }
    if (mode !== "src" && block.dst) {
      md.push(mode === "dst" ? block.dst : "> " + block.dst, "");
      txt.push(block.dst);
    }
    txt.push("");
  }

  exported = true;
  const stem = meetingFileStem();
  download(stem + ".md", md.join("\n"), "text/markdown;charset=utf-8");
  // A beat apart: fired together, the second is dropped as a duplicate click.
  setTimeout(() => download(stem + ".txt", txt.join("\n"), "text/plain;charset=utf-8"), 400);
};

// --- API key -----------------------------------------------------------------
// The key is typed once and kept in this browser. It is never in the page source,
// so the page itself can be hosted publicly without exposing anything.

function openGate(existing) {
  $("gate").hidden = false;
  $("keyInput").value = existing || "";
  setTimeout(() => $("keyInput").focus(), 50);
}

$("keySave").onclick = () => {
  const value = $("keyInput").value.trim();
  if (!value) return;
  apiKey = value;
  try { localStorage.setItem(KEY_STORE, value); } catch (err) {}
  $("gate").hidden = true;
  show(null);
};

$("keyInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("keySave").click(); });
$("keyEdit").onclick = () => openGate(apiKey);

// --- header fold -------------------------------------------------------------
// Remembered per device, since a phone and a laptop want different answers. The
// first visit gets the one that suits the screen rather than a fixed default.

const FOLD_STORE = "meetLive.fold";
let folded = (() => {
  let saved = null;
  try { saved = localStorage.getItem(FOLD_STORE); } catch (err) {}
  if (saved !== null) return saved === "1";
  return window.matchMedia("(max-width: 720px)").matches;
})();

function applyFold() {
  $("setup").hidden = folded;
  $("foldCaret").textContent = folded ? "▾" : "▴";
  $("fold").setAttribute("aria-expanded", String(!folded));
  $("fold").title = folded ? "설정 펼치기" : "설정 접기";
}

$("fold").onclick = () => {
  folded = !folded;
  try { localStorage.setItem(FOLD_STORE, folded ? "1" : "0"); } catch (err) {}
  applyFold();
};

// --- boot --------------------------------------------------------------------

applyFold();
restore();
$("clock").textContent = hhmmss(elapsedBase);   // restore() may have carried time over
render();
listDevices();
$("target").disabled = !translateOn;
$("device").disabled = $("source").value === "display";
// A restored meeting is exportable straight away. This used to wait for the
// next token, so a reload left the button dead with a full transcript on screen.
$("export").disabled = !segments.length;
showRedo();
if (!apiKey) openGate("");
if (!window.isSecureContext) {
  show("HTTPS가 아니면 마이크를 사용할 수 없습니다. https:// 주소로 열어주세요.");
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
